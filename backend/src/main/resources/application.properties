spring.application.name=personas-api
server.address=0.0.0.0
server.port=${PORT:8081}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql,classpath:db/migrate-estado.sql,classpath:db/migrate-foto-ruta.sql
spring.sql.init.data-locations=classpath:db/data.sql
spring.jpa.properties.hibernate.default_schema=personas
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
server.error.include-message=never
app.photo-directory=${PHOTO_DIRECTORY:storage/fotos}
